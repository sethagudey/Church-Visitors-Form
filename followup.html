<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Follow-Up Tracker</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

<a
  href="dashboard.html"
  class="back-btn"
>
  ← Dashboard
</a>

<div class="glass-card form-card">

  <h1>
    Follow-Up Tracker
  </h1>

  <p class="subtitle">
    Record and monitor visitor assimilation activities.
  </p>

  <form id="followupForm">

    <div class="form-group">
      <input
        type="text"
        name="visitorName"
        placeholder="Visitor Name"
        required
      >
    </div>

    <div class="form-group">
      <input
        type="text"
        name="phone"
        placeholder="Phone Number"
      >
    </div>

    <div class="form-group">
      <input
        type="text"
        name="assignedWorker"
        placeholder="Assigned Worker"
      >
    </div>

    <div class="form-group">

      <select
        name="status"
        required
      >

        <option value="">
          Current Status
        </option>

        <option>
          New Visitor
        </option>

        <option>
          Called
        </option>

        <option>
          WhatsApp Sent
        </option>

        <option>
          Home Visit Scheduled
        </option>

        <option>
          Home Visit Completed
        </option>

        <option>
          Invited To Church
        </option>

        <option>
          Returned To Church
        </option>

        <option>
          Membership Class
        </option>

        <option>
          Baptized
        </option>

        <option>
          Joined Ministry
        </option>

        <option>
          Member
        </option>

      </select>

    </div>

    <div class="form-group">

      <label>
        Next Follow-Up Date
      </label>

      <input
        type="date"
        name="nextDate"
      >

    </div>

    <div class="form-group">

      <textarea
        name="notes"
        placeholder="Follow-Up Notes"
      ></textarea>

    </div>

    <button
      type="submit"
      class="submit-btn"
    >
      Save Follow-Up
    </button>

  </form>

</div>

  </div>

  <script>

    const scriptURL =
      "PASTE_FOLLOWUP_API_URL_HERE";

    const form =
      document.getElementById(
        "followupForm"
      );

    form.addEventListener(
      "submit",
      async function(e){

        e.preventDefault();

        const button =
          document.querySelector(
            ".submit-btn"
          );

        button.innerText =
          "Saving...";

        button.disabled = true;

        const formData =
          new FormData(form);

        const data =
          Object.fromEntries(
            formData.entries()
          );

        try {

          const response =
            await fetch(
              scriptURL,
              {
                method: "POST",

                body:
                  JSON.stringify(data)
              }
            );

          const result =
            await response.json();

          if(result.success){

            alert(
              "Follow-Up Saved Successfully"
            );

            form.reset();

          }

          else {

            alert(
              "Submission Failed"
            );

          }

        }

        catch(error){

          console.error(error);

          alert(
            "Submission Failed"
          );

        }

        button.innerText =
          "Save Follow-Up";

        button.disabled =
          false;

      }
    );

  </script>

</body>

</html>
