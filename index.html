<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>
    Shalom Baptist Connect
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="hero-overlay">

  <div class="login-card">

<div class="church-badge">
  SBC
</div>

  Shalom Baptist Connect
</h1>

<h2>

</h2>

<p class="hero-text">

  id="errorMessage"

  </div>
