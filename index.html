<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>
    Shalom Baptist Connect
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="hero-overlay">

<div class="login-card">

  <div class="church-badge">
    SBC
  </div>

  <h1>
    Shalom Baptist Connect
  </h1>

  <h2>
    Visitor & Assimilation Platform
  </h2>

  <p class="hero-text">

    Welcome to the ministry platform for
    visitor care, follow-up, prayer support,
    and church assimilation.

  </p>

  <div class="form-group">

    <input
      type="password"
      id="accessCode"
      placeholder="Enter Access Code"
      autocomplete="off"
    >

  </div>

  <button
    type="button"
    class="main-btn"
    onclick="checkCode()"
  >
    Enter Platform
  </button>

  <p
    id="errorMessage"
    class="error-message"
  >
    Invalid Access Code
  </p>

</div>

  </div>

  <script>

    const ACCESS_CODE =
      "SBTVISITOR2026";

    function checkCode() {

      const code =
        document
          .getElementById(
            "accessCode"
          )
          .value
          .trim();

      const error =
        document
          .getElementById(
            "errorMessage"
          );

      if (
        code === ACCESS_CODE
      ) {

        window.location.href =
          "dashboard.html";

      }

      else {

        error.style.display =
          "block";

      }

    }

    document
      .getElementById(
        "accessCode"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            checkCode();

          }

        }
      );

  </script>

</body>

</html>
