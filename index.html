<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>
    Shalom Baptist Connect
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

<div class="glass-card">

  <div class="logo">
    SBC
  </div>

  <h1>
    Shalom Baptist Connect
  </h1>

  <h3>
    Visitor Assimilation Platform
  </h3>

  <p class="subtitle">
    Manage visitors, follow-ups, prayer requests, and church assimilation activities from one platform.
  </p>

  <div class="form-group">

    <input
      type="password"
      id="accessCode"
      placeholder="Enter Access Code"
    >

  </div>

  <button
    class="main-btn"
    onclick="checkCode()"
  >
    Access Platform
  </button>

  <p
    id="errorMessage"
    class="error-message"
  >
    Invalid Access Code
  </p>

</div>

  </div>

  <script>

    function checkCode() {

      const code =
        document.getElementById(
          "accessCode"
        ).value.trim();

      const validCode =
        "SBTVISITOR2026";

      if(code === validCode){

        window.location.href =
          "dashboard.html";

      }

      else {

        document.getElementById(
          "errorMessage"
        ).style.display =
          "block";

      }

    }

  </script>

</body>

</html>
