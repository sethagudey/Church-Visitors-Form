<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reports & Statistics</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

    <a
      href="dashboard.html"
      class="back-btn"
    >
      ← Dashboard
    </a>

    <div class="glass-card">

      <h1>
        Reports & Statistics
      </h1>

      <p class="subtitle">
        Visitor ministry performance overview.
      </p>

      <div class="stats-grid">

        <div class="stat-card">
          <h2 id="totalVisitors">247</h2>
          <p>Total Visitors</p>
        </div>

        <div class="stat-card">
          <h2 id="monthlyVisitors">18</h2>
          <p>This Month</p>
        </div>

        <div class="stat-card">
          <h2 id="joiningInterest">12</h2>
          <p>Interested In Joining</p>
        </div>

        <div class="stat-card">
          <h2 id="homeVisits">7</h2>
          <p>Home Visit Requests</p>
        </div>

        <div class="stat-card">
          <h2 id="followups">20</h2>
          <p>Follow-Ups Completed</p>
        </div>

        <div class="stat-card">
          <h2 id="prayers">14</h2>
          <p>Prayer Requests</p>
        </div>

        <div class="stat-card">
          <h2 id="members">5</h2>
          <p>New Members</p>
        </div>

        <div class="stat-card">
          <h2 id="returning">9</h2>
          <p>Returned Visitors</p>
        </div>

      </div>

      <div class="button-group">

        <a
          href="visitor.html"
          class="main-btn"
        >
          Register Visitor
        </a>

        <a
          href="followup.html"
          class="secondary-btn"
        >
          Follow-Up Tracker
        </a>

        <a
          href="prayers.html"
          class="secondary-btn"
        >
          Prayer Requests
        </a>

      </div>

    </div>

  </div>

</body>

</html>
